apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: devops
  labels:
    app: mariadb
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: mariadb

  template:
    metadata:
      labels:
        app: mariadb

    spec:
      containers:
        - name: mariadb
          image: mariadb:11.4
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3306

          envFrom:
            - secretRef:
                name: mariadb-secret

          volumeMounts:
            - name: mariadb-storage
              mountPath: /var/lib/mysql

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

      volumes:
        - name: mariadb-storage
          persistentVolumeClaim:
            claimName: mariadb-pvc
